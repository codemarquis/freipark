services:

  # One-shot: downloads Germany PBF and runs OSRM preprocessing.
  # Skips if /data/.osrm_ready exists (sentinel written only after all three steps succeed).
  # First run takes several hours — api waits indefinitely via depends_on: service_healthy.
  osrm-init:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    volumes:
      - osrm_data:/data
    entrypoint: /bin/sh
    command: >-
      -c "
      if [ ! -f /data/.osrm_ready ]; then
        apt-get update -qq &&
        apt-get install -y --no-install-recommends curl &&
        curl -fL -o /data/germany.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf &&
        osrm-extract -p /opt/car.lua /data/germany.osm.pbf &&
        rm /data/germany.osm.pbf &&
        osrm-partition /data/germany.osrm &&
        osrm-customize /data/germany.osrm &&
        touch /data/.osrm_ready;
      fi
      "
    restart: "no"

  osrm-germany:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    depends_on:
      osrm-init:
        condition: service_completed_successfully
    volumes:
      - osrm_data:/data
    command: >-
      osrm-routed --algorithm mld --max-table-size 10000 /data/germany.osrm
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No host port — only the api service reaches it on the internal network.

  api:
    build:
      context: ./backend
    restart: always
    env_file: ./backend/.env
    environment:
      OSRM_GERMANY_URL: ${OSRM_GERMANY_URL:-http://osrm-germany:5000}
    ports:
      - "8000:8000"
    depends_on:
      osrm-germany:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/db || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  osrm_data:
